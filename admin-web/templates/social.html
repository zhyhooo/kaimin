<div class="card">
  <div class="toolbar">
    <h2 style="border:none;margin:0;padding:0">社情民意列表</h2>
    <button class="btn btn-success" @click="$root.showSocialModal=true;$root.editingSocial=null;$root.socialForm={title:'',content:'',is_joint:false}">+ 新增社情民意</button>
  </div>
  <table><tr><th>标题</th><th>作者</th><th>支部</th><th>状态</th><th>时间</th><th>操作</th></tr>
  <tr v-for="i in $root.socialList" :key="i.id">
    <td>{{ i.title }}</td><td>{{ i.author_name||'-' }}</td><td>{{ i.branch_name||'-' }}</td>
    <td><span class="badge" :class="i.status==='city_adopted'||i.status==='province_adopted'||i.status==='national_adopted'?'badge-green':(i.status==='rejected'?'badge-red':'badge-blue')">{{ $root.socialStatusLabel(i.status) }}</span></td>
    <td>{{ $root.fmtTime(i.created_at) }}</td>
    <td>
      <select v-model="$root.adoptLevel[i.id]" style="width:100px;padding:4px"><option value="">--录用--</option><option value="city">市级</option><option value="province">省级</option><option value="national">全国</option></select>
      <button class="btn btn-primary btn-sm" @click="$root.adoptInfo(i.id)">确认</button>
      <button class="btn btn-danger btn-sm" @click="$root.deleteSocial(i.id)">删除</button>
    </td>
  </tr></table>
</div>
<div v-if="$root.showSocialModal" class="modal-overlay" @click.self="$root.showSocialModal=false">
  <div class="modal">
    <h2>{{ $root.editingSocial?'编辑':'新增' }}社情民意</h2>
    <div class="form-group"><label>标题 *</label><input v-model="$root.socialForm.title"></div>
    <div class="form-group"><label>正文 *</label><textarea v-model="$root.socialForm.content" style="min-height:150px"></textarea></div>
    <div class="form-group"><label><input type="checkbox" v-model="$root.socialForm.is_joint"> 联合提交</label></div>
    <button class="btn btn-primary" @click="$root.saveSocial">保存</button>
    <button class="btn btn-default" @click="$root.showSocialModal=false">取消</button>
  </div>
</div>
