<div class="card">
  <div class="toolbar">
    <h2 style="border:none;margin:0;padding:0">通知列表</h2>
    <button class="btn btn-success" @click="$root.showNotifModal=true;$root.editingNotif=null;$root.notifForm={title:'',content:'',cover_image:''}">+ 新增通知</button>
  </div>
  <table><tr><th>ID</th><th>标题</th><th>时间</th><th>操作</th></tr>
  <tr v-for="n in $root.notificationList" :key="n.id">
    <td>{{ n.id }}</td><td>{{ n.title }}</td><td>{{ $root.fmtTime(n.publish_time) }}</td>
    <td>
      <button v-if="!n.is_deleted" class="btn btn-default btn-sm" @click="$root.editNotif(n)">编辑</button>
      <button v-if="!n.is_deleted" class="btn btn-danger btn-sm" @click="$root.deleteNotif(n.id)">删除</button>
      <button v-if="n.is_deleted" class="btn btn-success btn-sm" @click="$root.restoreNotif(n.id)">🔄 恢复</button>
    </td>
  </tr></table>
</div>
<div v-if="$root.showNotifModal" class="modal-overlay" @click.self="$root.showNotifModal=false">
  <div class="modal">
    <h2>{{ $root.editingNotif?'编辑':'新增' }}通知</h2>
    <div class="form-group"><label>标题 *</label><input v-model="$root.notifForm.title"></div>
    <div class="form-group"><label>正文 *</label><textarea v-model="$root.notifForm.content" style="min-height:150px"></textarea></div>
    <div class="form-group"><label>封面图URL</label><input v-model="$root.notifForm.cover_image"></div>
    <button class="btn btn-primary" @click="$root.saveNotif">保存</button>
    <button class="btn btn-default" @click="$root.showNotifModal=false">取消</button>
  </div>
</div>
