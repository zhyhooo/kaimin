<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开明向阳 - 后台管理</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#333;background:#f0f2f5}
#app{display:flex;min-height:100vh}
.sidebar{width:220px;background:#001529;color:#fff;padding-top:20px;flex-shrink:0;position:relative}
.sidebar .logo{text-align:center;font-size:18px;font-weight:bold;padding:0 20px 20px;border-bottom:1px solid #002140;margin-bottom:10px}
.sidebar .logo span{color:#C41E2E}
.nav-item{padding:14px 24px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.2s;font-size:14px;color:rgba(255,255,255,.65)}
.nav-item:hover,.nav-item.active{background:#1890ff;color:#fff}
.main{flex:1;padding:24px;overflow-y:auto}
.card{background:#fff;border-radius:8px;padding:24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:18px;margin-bottom:16px;color:#1a1a1a;border-bottom:2px solid #C41E2E;padding-bottom:8px;display:inline-block}
.card h3{font-size:15px;margin:16px 0 8px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:8px;padding:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat-card .num{font-size:36px;font-weight:bold;color:#1890ff}
.stat-card .label{font-size:13px;color:#999;margin-top:6px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #f0f0f0;font-size:13px}
th{background:#fafafa;font-weight:600;color:#666}
tr:hover{background:#f5f9ff}
.btn{padding:7px 16px;border:none;border-radius:4px;cursor:pointer;font-size:13px;transition:.2s;margin:0 4px}
.btn-primary{background:#1890ff;color:#fff}
.btn-danger{background:#ff4d4f;color:#fff}
.btn-success{background:#52c41a;color:#fff}
.btn-warning{background:#faad14;color:#fff}
.btn-default{background:#fff;border:1px solid #d9d9d9;color:#666}
.btn:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:12px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-weight:500;color:#555;font-size:13px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px}
.form-group textarea{resize:vertical;min-height:80px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.badge{padding:2px 8px;border-radius:10px;font-size:12px}
.badge-blue{background:#e6f7ff;color:#1890ff}
.badge-green{background:#f6ffed;color:#52c41a}
.badge-red{background:#fff2f0;color:#ff4d4f}
.badge-orange{background:#fff7e6;color:#fa8c16}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:8px;padding:24px;width:600px;max-height:85vh;overflow-y:auto}
.modal h2{margin-bottom:20px;font-size:18px}
.empty{text-align:center;color:#999;padding:40px;font-size:14px}
.chart-box{height:300px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.toolbar input{width:240px;padding:8px 12px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar">
    <div class="logo"><span>开明向阳</span> 后台</div>
    <div class="nav-item" :class="{active:page==='dashboard'}" @click="switchPage('dashboard')">📊 数据仪表盘</div>
    <div v-if="isSuperAdmin" class="nav-item" :class="{active:page==='users'}" @click="switchPage('users')">👤 用户管理</div>
    <div v-if="canManageMembers" class="nav-item" :class="{active:page==='members'}" @click="switchPage('members')">👥 会员管理</div>
    <div v-if="canManageMembers" class="nav-item" :class="{active:page==='branches'}" @click="switchPage('branches')">🏛️ 支部管理</div>
    <div v-if="canManageEvents" class="nav-item" :class="{active:page==='events'}" @click="switchPage('events')">📅 活动管理</div>
    <div v-if="canManageSocial" class="nav-item" :class="{active:page==='social'}" @click="switchPage('social')">📝 社情民意</div>
    <div v-if="canManageVenues" class="nav-item" :class="{active:page==='venues'}" @click="switchPage('venues')">🏠 阵地管理</div>
    <div v-if="canManageScoring" class="nav-item" :class="{active:page==='scoring'}" @click="switchPage('scoring')">⭐ 积分规则</div>
    <div v-if="canManageNotif" class="nav-item" :class="{active:page==='notifications'}" @click="switchPage('notifications')">🔔 通知管理</div>
    <div v-if="isSuperAdmin" class="nav-item" :class="{active:page==='settings'}" @click="switchPage('settings')">⚙️ 系统配置</div>
    <div style="position:absolute;bottom:20px;left:20px;color:rgba(255,255,255,.3);font-size:12px">v1.0 | {{user?.phone}}</div>
  </div>

  <div class="main">
    <div v-if="token" style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:16px;gap:12px">
      <span style="font-size:13px;color:#999">{{user?.phone}} | {{roleLabel(user?.role)}}</span>
      <button class="btn btn-danger btn-sm" @click="logout">退出登录</button>
    </div>

    <!-- 登录 -->
    <div v-if="!token" class="card" style="max-width:400px;margin:100px auto">
      <h2>{{loginMode==='login'?'管理员登录':'管理员注册'}}</h2>
      <div class="form-group"><label>手机号</label><input v-model="loginPhone" placeholder="请输入手机号"></div>
      <div class="form-group"><label>密码</label><input type="password" v-model="loginPassword" placeholder="请输入密码（至少6位）"></div>
      <button class="btn btn-primary" @click="doLogin" style="width:100%;padding:10px;margin-bottom:12px">{{loginMode==='login'?'登录':'注册'}}</button>
      <div style="text-align:center;font-size:13px;color:#999">
        <span v-if="loginMode==='login'">没有账号？<a href="#" @click.prevent="loginMode='register';loginPassword=''" style="color:#1890ff">立即注册</a></span>
        <span v-else>已有账号？<a href="#" @click.prevent="loginMode='login';loginPassword=''" style="color:#1890ff">去登录</a></span>
      </div>
    </div>

    <!-- 动态内容区 -->
    <component v-if="token" :is="currentSectionComp" :key="page"></component>
  </div>
</div>

<script>
const { createApp } = Vue
createApp({
  data(){
    return {
      token: localStorage.getItem('admin_token'),
      user: null,
      page: 'dashboard',
      loginPhone: '',
      loginPassword: '',
      loginMode: 'login',
      stats: {},
      // 用户管理
      adminUsers: [], showUserModal: false, editingUser: null, userForm: {phone:'',role:'org_leader'},
      roles: [
        {name:'super_admin',label:'超级管理员',menus:['全部'],dataScope:'全体'},
        {name:'org_leader',label:'总支委员',menus:['会员管理','支部管理','活动管理','积分规则','社情民意','阵地审批','通知管理'],dataScope:'全体'},
        {name:'branch_leader',label:'支部主委',menus:['活动管理'],dataScope:'本支部'}
      ],
      // 会员管理
      memberList: [], memberKeyword: '', showMemberModal: false, editingMember: null, memberForm: {}, branches: [],
      showImportModal: false, selectedFile: null, importing: false, importResult: null,
      // 支部管理
      branchList: [], showBranchModal: false, editingBranch: null, branchForm: {},
      // 活动管理
      eventList: [], showEventModal: false, editingEvent: null, eventForm: {},
      // 社情民意
      socialList: [], showSocialModal: false, editingSocial: null, socialForm: {}, adoptLevel: {},
      // 阵地
      pendingBookings: [],
      // 积分规则
      scoreRules: [], showAddRule: false, editingRule: null, newRule: {dimension:'meeting',activity_type:'',score:5,max_score:20},
      dims: [{value:'political',label:'政治思想'},{value:'meeting',label:'会务活动'},{value:'participation',label:'参政议政'},{value:'social',label:'社会服务'},{value:'publicity',label:'宣传报道'},{value:'performance',label:'工作业绩'}],
      // 通知
      notificationList: [], showNotifModal: false, editingNotif: null, notifForm: {},
      // 配置
      config: {email_host:'',email_port:465,email_user:'',email_target:'',notify_template_id:'',audit_template_id:''},
      // 模板缓存
      loadedTemplates: {}
    }
  },
  computed: {
    currentSectionComp(){
      const tmpl = this.loadedTemplates[this.page]
      if(!tmpl) return { template: '<div class="empty" style="padding:60px">加载中...</div>' }
      return { template: tmpl }
    }
  },
  async mounted(){
    if(this.token) await this.initApp()
  },
  methods: {
    async api(url, method='GET', data=null){
      try {
        const res = await axios({ url, method, data,
          headers:{ Authorization:'Bearer '+this.token } })
        return res.data
      } catch(e){
        if(e.response?.status===401){this.token=null;localStorage.removeItem('admin_token')}
        throw e
      }
    },
    async initApp(){
      const me = await this.api('/auth/me')
      this.user = me
      const role = me.role
      this.isSuperAdmin = role === 'super_admin'
      this.isOrgLeader = role === 'super_admin' || role === 'org_leader'
      this.isLeader = this.isOrgLeader || role === 'branch_leader'
      this.canManageMembers = this.isOrgLeader
      this.canManageEvents = this.isLeader
      this.canManageSocial = this.isOrgLeader
      this.canManageVenues = this.isOrgLeader
      this.canManageScoring = this.isOrgLeader
      this.canManageNotif = this.isOrgLeader
      await this.switchPage('dashboard')
    },
    async switchPage(page){
      this.page = page
      // 加载模板（按需+缓存）
      if(!this.loadedTemplates[page]){
        try {
          const html = await this.api('/api/templates/'+page)
          this.loadedTemplates[page] = html
        } catch(e){
          this.loadedTemplates[page] = '<div class="empty">加载失败或无权限</div>'
        }
      }
      const loaders={dashboard:()=>this.loadDashboard(),users:()=>this.loadUsers(),members:()=>this.loadMembers(),branches:()=>this.loadBranches(),events:()=>this.loadEvents(),social:()=>this.loadSocial(),venues:()=>this.loadVenues(),scoring:()=>this.loadRules(),notifications:()=>this.loadNotifications()}
      if(loaders[page]) await loaders[page]()
    },
    async loadDashboard(){
      try{
        const [mems,events,social,venues,branches] = await Promise.all([
          this.api('/members/'),this.api('/events/'),this.api('/social-info/admin'),
          this.api('/venues/bookings/pending'),this.api('/branches/')
        ])
        this.memberList=mems||[]; this.eventList=events||[]; this.socialList=social||[]
        this.pendingBookings=venues||[]; this.branches=branches||[]
        this.stats={total_members:mems?.length||0,active_events:events?.filter(e=>e.status==='published')?.length||0,total_infos:social?.length||0,pending_bookings:venues?.length||0}
        const stats = await this.api('/stats/dashboard')
        this.$nextTick(()=>{
          setTimeout(()=>{
            const labels = (stats.event_monthly||[]).map(d=>d.label)
            const signups = (stats.event_monthly||[]).map(d=>d.signups)
            const infos   = (stats.info_monthly||[]).map(d=>d.count)
            const c1=document.getElementById('chart-events')
            const c2=document.getElementById('chart-infos')
            if(c1&&labels.length) echarts.init(c1).setOption({tooltip:{},xAxis:{data:labels},yAxis:{},series:[{name:'报名人次',type:'bar',data:signups}]})
            if(c2&&labels.length) echarts.init(c2).setOption({tooltip:{},xAxis:{data:labels},yAxis:{},series:[{name:'社情民意',type:'line',data:infos}]})
            if(!labels.length){
              if(c1) echarts.init(c1).setOption({title:{text:'暂无活动数据',left:'center',top:'center',textStyle:{color:'#999',fontSize:14}}})
              if(c2) echarts.init(c2).setOption({title:{text:'暂无社情民意数据',left:'center',top:'center',textStyle:{color:'#999',fontSize:14}}})
            }
          },200)
        })
      }catch(e){console.error(e)}
    },
    async doLogin(){
      if(!this.loginPhone || !/^1[3-9]\d{9}$/.test(this.loginPhone)){ alert('请输入正确的11位手机号'); return }
      if(!this.loginPassword || this.loginPassword.length < 6){ alert('密码至少6位'); return }
      try {
        let res
        if(this.loginMode==='register'){
          res = await axios.post('/auth/register', {phone:this.loginPhone, password:this.loginPassword})
        } else {
          res = await axios.post('/auth/admin-login', {phone:this.loginPhone, password:this.loginPassword||undefined})
        }
        this.token = res.data.access_token
        localStorage.setItem('admin_token', res.data.access_token)
        await this.initApp()
      } catch(e){
        const detail = e.response?.data?.detail
        if(Array.isArray(detail)){ alert('输入格式有误: ' + detail[0]?.msg) }
        else { alert(detail || '操作失败') }
      }
    },
    logout(){
      this.token=null; this.user=null; this.loadedTemplates={}
      localStorage.removeItem('admin_token'); this.page='dashboard'
    },
    handleError(e, prefix){
      const d = e.response?.data?.detail
      alert(prefix+': '+(Array.isArray(d) ? d.map(x=>x.msg).join('; ') : (d || e.message)))
    },
    // ===== 用户管理 =====
    async loadUsers(){ try{ this.adminUsers=await this.api('/users/')||[] }catch(e){} },
    async saveUser(){
      if(!this.editingUser){
        if(!this.userForm.phone || !/^1[3-9]\d{9}$/.test(this.userForm.phone)){
          alert('请输入正确的11位手机号'); return
        }
      }
      try{
        if(this.editingUser){ await this.api('/users/'+this.editingUser.id,'PUT',{role:this.userForm.role}) }
        else { await this.api('/users/','POST',this.userForm) }
        this.showUserModal=false; await this.loadUsers()
      } catch(e){ this.handleError(e, '保存失败') }
    },
    editUser(u){ this.editingUser=u; this.userForm={phone:u.phone,role:u.role}; this.showUserModal=true },
    async toggleUser(u){ try{ await this.api('/users/'+u.id,'PUT',{is_active:!u.is_active}); await this.loadUsers() }catch(e){ alert('操作失败') } },
    async deleteUser(id){ if(!confirm('确认删除?'))return; try{ await this.api('/users/'+id,'DELETE'); await this.loadUsers() }catch(e){ alert('删除失败') } },
    // ===== 会员管理 =====
    async loadMembers(){ try{ const url=this.memberKeyword?'/members/?keyword='+encodeURIComponent(this.memberKeyword):'/members/'; const [mems, brs]=await Promise.all([this.api(url), this.api('/branches/')]); this.memberList=mems||[]; this.branches=brs||[] }catch(e){} },
    async saveMember(){
      if(!this.memberForm.name || !this.memberForm.name.trim()){
        alert('请输入姓名'); return
      }
      if(!this.memberForm.phone || !/^1[3-9]\d{9}$/.test(this.memberForm.phone)){
        alert('请输入正确的11位手机号'); return
      }
      try{
        const data={...this.memberForm}
        if(data.branch_id) data.branch_id=parseInt(data.branch_id)
        if(this.editingMember){ await this.api('/members/'+this.editingMember.id,'PUT',data) }
        else { await this.api('/members/','POST',data) }
        this.showMemberModal=false; await this.loadMembers()
      } catch(e){ this.handleError(e, '保存失败') }
    },
    editMember(m){
      this.editingMember=m; this.showMemberModal=true
      this.memberForm={
        name:m.name, phone:m.phone||'', id_card:m.id_card||'',
        branch_id:m.branch_id, org_position:m.org_position||'', join_date:m.join_date||'',
        work_unit:m.work_unit||'', work_position:m.work_position||'',
        title:m.title||'', education:m.education||'', school:m.school||'',
        specialty:m.specialty||'', social_position:m.social_position||'', native_place:m.native_place||''
      }
    },
    async deleteMember(id){ if(!confirm('确认删除?'))return; try{ await this.api('/members/'+id,'DELETE'); await this.loadMembers() }catch(e){ alert('删除失败') } },
    onFileSelected(e){ this.selectedFile = e.target.files[0]; this.importResult = null },
    async doImport(){
      if(!this.selectedFile) return; this.importing = true
      try{
        const formData = new FormData(); formData.append('file', this.selectedFile)
        const res = await axios.post('/members/import/excel', formData, {
          headers: { Authorization: 'Bearer '+this.token, 'Content-Type': 'multipart/form-data' }
        })
        this.importResult = res.data
        if(res.data.success_count > 0) await this.loadMembers()
      } catch(e){ this.handleError(e, '导入失败') }
      this.importing = false
    },
    downloadTemplate(){
      const headers = ['姓名','手机号','身份证号','支部名称','会内职务','工作单位','工作职务','职称','学历','毕业院校','专业特长','社会职务','籍贯','入会时间']
      const example = ['张三','13800001111','330106199001011234','第一支部','会员','XX科技有限公司','工程师','高级工程师','本科','浙江大学','计算机','市政协委员','浙江杭州','2024-01-01']
      const csvContent = '\uFEFF' + headers.join(',') + '\n' + example.join(',') + '\n'
      const blob = new Blob([csvContent], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;charset=utf-8'})
      const url = URL.createObjectURL(blob); const a = document.createElement('a')
      a.href=url; a.download='会员导入模板.csv'; a.click(); URL.revokeObjectURL(url)
    },
    // ===== 支部管理 =====
    async loadBranches(){ try{ this.branchList=await this.api('/branches/')||[] }catch(e){} },
    async saveBranch(){
      if(!this.branchForm.name || !this.branchForm.name.trim()){
        alert('请输入支部名称'); return
      }
      try{
        const data={...this.branchForm}
        if(data.parent_id) data.parent_id=parseInt(data.parent_id)
        data.sort_order=parseInt(data.sort_order)||0
        if(this.editingBranch){ await this.api('/branches/'+this.editingBranch.id,'PUT',data) }
        else { await this.api('/branches/','POST',data) }
        this.showBranchModal=false; await this.loadBranches()
      } catch(e){ this.handleError(e, '保存失败') }
    },
    editBranch(b){
      this.editingBranch=b; this.showBranchModal=true
      this.branchForm={name:b.name,parent_id:b.parent_id,leader_name:b.leader_name||'',leader_phone:b.leader_phone||'',sort_order:b.sort_order||0}
    },
    async deleteBranch(id){ if(!confirm('确认删除该支部？'))return; try{ await this.api('/branches/'+id,'DELETE'); await this.loadBranches() }catch(e){ alert('删除失败: '+(e.response?.data?.detail||e.message)) } },
    // ===== 活动管理 =====
    async loadEvents(){ try{ this.eventList=await this.api('/events/')||[] }catch(e){} },
    async saveEvent(){
      if(!this.eventForm.title || !this.eventForm.title.trim()){
        alert('请输入活动标题'); return
      }
      if(!this.eventForm.event_time){
        alert('请选择活动时间'); return
      }
      try{
        if(this.editingEvent){ await this.api('/events/'+this.editingEvent.id,'PUT',this.eventForm) }
        else { await this.api('/events/','POST',this.eventForm) }
        this.showEventModal=false; await this.loadEvents()
      } catch(e){ this.handleError(e, '保存失败') }
    },
    editEvent(e){
      this.editingEvent=e; this.showEventModal=true
      this.eventForm={
        title:e.title, content:e.content||'', cover_image:e.cover_image||'',
        event_time:(e.event_time||'').replace(' ','T'),
        signup_deadline:(e.signup_deadline||'').replace(' ','T'),
        location:e.location||'', max_participants:e.max_participants||0,
        contact_person:e.contact_person||''
      }
    },
    async deleteEvent(id){ if(!confirm('确认删除?'))return; try{ await this.api('/events/'+id,'DELETE'); await this.loadEvents() }catch(e){ alert('删除失败') } },
    exportRegistrations(eventId){
      if(!confirm('确认导出该活动的报名名单？')) return
      const a = document.createElement('a')
      a.href = '/events/' + eventId + '/registrations/export'
      a.download = ''; document.body.appendChild(a); a.click(); document.body.removeChild(a)
    },
    // ===== 社情民意 =====
    async loadSocial(){ try{ this.socialList=await this.api('/social-info/admin')||[] }catch(e){} },
    async saveSocial(){
      if(!this.socialForm.title || !this.socialForm.title.trim()){
        alert('请输入标题'); return
      }
      if(!this.socialForm.content || !this.socialForm.content.trim()){
        alert('请输入正文'); return
      }
      try{ await this.api('/social-info/','POST',this.socialForm); this.showSocialModal=false; await this.loadSocial() }
      catch(e){ this.handleError(e, '保存失败') }
    },
    async adoptInfo(id){ try{ await this.api('/social-info/'+id+'/adopt','POST',{level:this.adoptLevel[id]}); alert('已标记'); await this.loadSocial() }catch(e){ alert('操作失败') } },
    async deleteSocial(id){ if(!confirm('确认删除?'))return; try{ await this.api('/social-info/'+id,'DELETE'); await this.loadSocial() }catch(e){ alert('删除失败') } },
    // ===== 阵地 =====
    async loadVenues(){ try{ this.pendingBookings=await this.api('/venues/bookings/pending')||[] }catch(e){} },
    async approveBooking(id){ try{ await this.api('/venues/bookings/'+id+'/approve','POST'); await this.loadVenues() }catch(e){ alert('操作失败') } },
    async rejectBooking(id){ const r=prompt('驳回理由'); if(r){ try{ await this.api('/venues/bookings/'+id+'/reject?reason='+encodeURIComponent(r),'POST'); await this.loadVenues() }catch(e){ alert('操作失败') }}},
    // ===== 积分规则 =====
    async loadRules(){ try{ this.scoreRules=await this.api('/scoring/rules')||[] }catch(e){} },
    async saveRule(){
      try{
        const params='dimension='+this.newRule.dimension+'&activity_type='+encodeURIComponent(this.newRule.activity_type)+'&score='+this.newRule.score+'&max_score='+(this.newRule.max_score||'')
        if(this.editingRule){ await this.api('/scoring/rules/'+this.editingRule.id+'?'+params,'PUT') }
        else { await this.api('/scoring/rules?'+params,'POST') }
        this.showAddRule=false; await this.loadRules()
      }catch(e){ alert('保存失败') }
    },
    editRule(r){ this.editingRule=r; this.newRule={dimension:r.dimension,activity_type:r.activity_type,score:r.score,max_score:r.max_score||20}; this.showAddRule=true },
    async deleteRule(id){ if(!confirm('确认删除?'))return; try{ await this.api('/scoring/rules/'+id,'DELETE'); await this.loadRules() }catch(e){ alert('删除失败') } },
    // ===== 通知 =====
    async loadNotifications(){ try{ this.notificationList=await this.api('/notifications/')||[] }catch(e){} },
    async saveNotif(){
      if(!this.notifForm.title || !this.notifForm.title.trim()){
        alert('请输入通知标题'); return
      }
      if(!this.notifForm.content || !this.notifForm.content.trim()){
        alert('请输入通知正文'); return
      }
      try{
        if(this.editingNotif){ await this.api('/notifications/'+this.editingNotif.id,'PUT',this.notifForm) }
        else { await this.api('/notifications/','POST',this.notifForm) }
        this.showNotifModal=false; await this.loadNotifications()
      } catch(e){ this.handleError(e, '保存失败') }
    },
    editNotif(n){ this.editingNotif=n; this.notifForm={title:n.title,content:n.content||'',cover_image:n.cover_image||''}; this.showNotifModal=true },
    async deleteNotif(id){ if(!confirm('确认删除?'))return; try{ await this.api('/notifications/'+id,'DELETE'); await this.loadNotifications() }catch(e){ alert('删除失败') } },
    // ===== 工具 =====
    roleLabel(r){ const m={super_admin:'超级管理员',org_leader:'总支委员',branch_leader:'支部主委',member:'会员',public:'公众'}; return m[r]||r },
    statusLabel(s){ const m={active:'在会',inactive:'离会',pending:'待审核'}; return m[s]||s },
    socialStatusLabel(s){ const m={pending:'待审核',city_adopted:'市级录用',province_adopted:'省级录用',national_adopted:'全国录用',rejected:'未录用'}; return m[s]||s },
    dimLabel(d){ const m={political:'政治思想',meeting:'会务活动',participation:'参政议政',social:'社会服务',publicity:'宣传报道',performance:'工作业绩'}; return m[d]||d },
    fmtTime(t){ if(!t)return'-'; return new Date(t).toLocaleString('zh-CN') },
    saveConfig(t){ alert('配置保存成功（需后端支持）') }
  }
}).mount('#app')
</script>
</body>
</html>
